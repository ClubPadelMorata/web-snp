<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNP Femenino</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- CABECERA -->
        <header class="header">
            <div class="logo">
                <span>🎾</span>
                <div>
                    <h1>SNP Femenino</h1>
                    <p>Series Nacionales de Pádel</p>
                </div>
            </div>
        </header>


        <!-- NAVEGACIÓN -->
        <nav class="nav">

            <button class="nav-btn active" data-section="inicio">
                🏠
                <span>Inicio</span>
            </button>

            <button class="nav-btn" data-section="jugadoras">
                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-user-group">
                    <path d="M17 21v-1a2 2 0 00-2-2H9a2 2 0 0 0-2 2v1"/>
                    <path d="M19 10h1a2 2 0 012 2v1"/>
                    <path d="M5 10H4a2 2 0 00-2 2v1"/>
                    <circle cx="12" cy="11" r="3"/>
                    <circle cx="18" cy="4" r="2"/>
                    <circle cx="6" cy="4" r="2"/>
                </svg>
                <span>Jugadoras</span>
            </button>

            <button class="nav-btn" data-section="jornadas">
                📅
                <span>Jornadas</span>
            </button>

            <button class="nav-btn" data-section="estadisticas">
                📊
                <span>Estadísticas</span>
            </button>

        </nav>


        <!-- CONTENIDO -->
        <main class="content">

            <!-- INICIO -->
            <section id="inicio" class="section active-section">

                <h2>Próxima jornada</h2>

                <div class="match-card">

                    <div class="match-info">

                        <span class="tag home">🏠 EN CASA</span>

                        <h3>SNP Femenino</h3>

                        <div class="vs">VS</div>

                        <h3>Equipo rival</h3>

                        <p class="date">
                            📅 Próximamente
                        </p>

                    </div>

                    <button class="primary-btn">
                        Gestionar jornada
                    </button>

                </div>

            </section>


            <!-- JUGADORAS -->
            <section id="jugadoras" class="section">

                <div class="section-header">
                <button id="update-points-btn" class="update-btn" title="Actualizar puntuaciones">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-refresh-cw">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M8 16H3v5"/>
                    </svg>
                </button>

                <button id="add-player-btn" class="primary-btn" title="Añadir jugadora">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-user-round-plus">
                        <path d="M2 21a8 8 0 0 1 13.292-6"/>
                        <circle cx="10" cy="8" r="5"/>
                        <path d="M19 16v6"/>
                        <path d="M22 19h-6"/>
                    </svg>
                </button>
            </div>

                <div id="players-list" class="players-list">
                    <!-- Las jugadoras aparecerán aquí -->
                </div>

            </section>


            <!-- JORNADAS -->
            <section id="jornadas" class="section">

                <div class="section-header">
                    <div>
                        <h2>Jornadas</h2>
                        <p>Calendario de la temporada</p>
                    </div>

                    <button class="primary-btn">
                        + Nueva jornada
                    </button>
                </div>

                <div id="matches-list">

                    <div class="empty-state">
                        <span>📅</span>
                        <p>Todavía no hay jornadas creadas</p>
                    </div>

                </div>

            </section>


            <!-- ESTADÍSTICAS -->
            <section id="estadisticas" class="section">

                <h2>Estadísticas</h2>

                <div class="stats-grid">

                    <div class="stat-card">
                        <span>👩</span>
                        <p>Jugadoras</p>
                        <strong id="total-players">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>📋</span>
                        <p>Convocatorias</p>
                        <strong>0</strong>
                    </div>

                    <div class="stat-card">
                        <span>🎾</span>
                        <p>Partidos jugados</p>
                        <strong>0</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- MODAL JUGADORA -->
<div id="player-modal" class="modal">

    <div class="modal-content">

        <button id="close-modal" class="close-btn">×</button>

        <h2 id="modal-title">Nueva jugadora</h2>

        <form id="player-form">

            <label for="player-name">Nombre</label>
            <input
                type="text"
                id="player-name"
                placeholder="Nombre de la jugadora"
                required
            >

            <label for="player-points">Puntuación</label>
            <input
                type="number"
                id="player-points"
                step="0.01"
                placeholder="Ej. 8.15"
                required
            >

            <label for="player-position">Posición</label>

           <select id="player-position" required>
            <option value="">Selecciona posición</option>
            <option value="Derecha">Derecha</option>
            <option value="Derecha preferente">Derecha preferente</option>
            <option value="Ambas">Ambas</option>
            <option value="Revés">Revés</option>
            <option value="Revés preferente">Revés preferente</option>
        </select>

            <button type="submit" class="primary-btn modal-save">
                Guardar jugadora
            </button>

        </form>

    </div>

</div>

    <script src="main.js"></script>

</body>
</html>
