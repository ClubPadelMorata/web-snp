<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNP Femenino</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- CABECERA -->
        <header class="header">
            <div class="logo">
                <span>🎾</span>
                <div>
                    <h1>SNP Femenino</h1>
                    <p>Series Nacionales de Pádel</p>
                </div>
            </div>
        </header>


        <!-- NAVEGACIÓN -->
        <nav class="nav">

            <button class="nav-btn active" data-section="inicio">
                🏠
                <span>Inicio</span>
            </button>

            <button class="nav-btn" data-section="jugadoras">
                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-user-group">
                    <path d="M17 21v-1a2 2 0 00-2-2H9a2 2 0 0 0-2 2v1"/>
                    <path d="M19 10h1a2 2 0 012 2v1"/>
                    <path d="M5 10H4a2 2 0 00-2 2v1"/>
                    <circle cx="12" cy="11" r="3"/>
                    <circle cx="18" cy="4" r="2"/>
                    <circle cx="6" cy="4" r="2"/>
                </svg>
                <span>Jugadoras</span>
            </button>

            <button class="nav-btn" data-section="jornadas">
                <span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-calendar-clock">
                    <path d="M16 14v2.2l1.6 1"/>
                    <path d="M16 2v3"/>
                    <path d="M21 7.338V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2.338"/>
                    <path d="M3 9h5.859"/>
                    <path d="M8 2v3"/>
                    <circle cx="16" cy="16" r="6"/>
                </svg>
            </span>
                <span>Jornadas</span>
            </button>

            <button class="nav-btn" data-section="estadisticas">
                📊
                <span>Estadísticas</span>
            </button>

        </nav>


        <!-- CONTENIDO -->
        <main class="content">

            <!-- INICIO -->
            <section id="inicio" class="section active-section">

                <h2>Próxima jornada</h2>

                <div class="match-card">

                    <div class="match-info">

                        <span class="tag home">🏠 EN CASA</span>

                        <h3>SNP Femenino</h3>

                        <div class="vs">VS</div>

                        <h3>Equipo rival</h3>

                        <p class="date">
                            📅 Próximamente
                        </p>

                    </div>

                    <button class="primary-btn">
                        Gestionar jornada
                    </button>

                </div>

            </section>


            <!-- JUGADORAS -->
            <section id="jugadoras" class="section">

                <div class="section-header">
                <button id="update-points-btn" class="update-btn" title="Actualizar puntuaciones">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-refresh-cw">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M8 16H3v5"/>
                    </svg>
                </button>

                <button id="add-player-btn" class="primary-btn" title="Añadir jugadora">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-user-round-plus">
                        <path d="M2 21a8 8 0 0 1 13.292-6"/>
                        <circle cx="10" cy="8" r="5"/>
                        <path d="M19 16v6"/>
                        <path d="M22 19h-6"/>
                    </svg>
                </button>
            </div>

                <div id="players-list" class="players-list">
                    <!-- Las jugadoras aparecerán aquí -->
                </div>

            </section>


            <!-- JORNADAS -->
            <section id="jornadas" class="section">

                <div class="section-header">
                    
                    <button id="add-match-btn" class="primary-btn" title="Nueva jornada">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-calendar-plus">
                        <path d="M16 18h6"/>
                        <path d="M16 2v3"/>
                        <path d="M19 15v6"/>
                        <path d="M21 11.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.3"/>
                        <path d="M3 9h18"/>
                        <path d="M8 2v3"/>
                    </svg>
                </button>
                </div>

                <div id="matches-list">

                    <div class="empty-state">
                        <span>📅</span>
                        <p>Todavía no hay jornadas creadas</p>
                    </div>

                </div>

            </section>


            <!-- ESTADÍSTICAS -->
            <section id="estadisticas" class="section">

                <h2>Estadísticas</h2>

                <div class="stats-grid">

                    <div class="stat-card">
                        <span>👩</span>
                        <p>Jugadoras</p>
                        <strong id="total-players">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>📋</span>
                        <p>Convocatorias</p>
                        <strong>0</strong>
                    </div>

                    <div class="stat-card">
                        <span>🎾</span>
                        <p>Partidos jugados</p>
                        <strong>0</strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- MODAL JUGADORA -->
<div id="player-modal" class="modal">

    <div class="modal-content">

        <button id="close-modal" class="close-btn">×</button>

        <h2 id="modal-title">Nueva jugadora</h2>

        <form id="player-form">

            <label for="player-name">Nombre</label>
            <input
                type="text"
                id="player-name"
                placeholder="Nombre de la jugadora"
                required
            >

            <label for="player-points">Puntuación</label>
            <input
                type="number"
                id="player-points"
                step="0.01"
                placeholder="Ej. 8.15"
                required
            >

            <label for="player-position">Posición</label>

           <select id="player-position" required>
            <option value="">Selecciona posición</option>
            <option value="Derecha">Derecha</option>
            <option value="Derecha preferente">Derecha preferente</option>
            <option value="Ambas">Ambas</option>
            <option value="Revés">Revés</option>
            <option value="Revés preferente">Revés preferente</option>
        </select>

            <button type="submit" class="primary-btn modal-save">
                Guardar jugadora
            </button>

        </form>

    </div>

</div>
<!-- MODAL NUEVA JORNADA -->

<div id="match-modal" class="modal">

    <div class="modal-content">

        <button id="close-match-modal" class="close-modal">
            ✕
        </button>

        <h2 id="match-modal-title">
            Nueva jornada
        </h2>

        <form id="match-form">

            <div class="form-group">

                <label for="match-number">
                    Jornada
                </label>

                <input
                    type="number"
                    id="match-number"
                    min="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="match-date">
                    Fecha
                </label>

                <input
                    type="date"
                    id="match-date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="match-time">
                    Hora
                </label>

                <input
                    type="time"
                    id="match-time"
                    required
                >

            </div>


            <div class="form-group">

                <label for="match-rival">
                    Rival
                </label>

                <input
                    type="text"
                    id="match-rival"
                    placeholder="Nombre del equipo rival"
                    required
                >

            </div>

            <div class="form-group">
    <label>¿Dónde se juega?</label>

    <div class="location-options">

        <label class="location-option">

            <input type="radio" name="location" value="casa" checked>

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24"
                 height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 class="lucide lucide-house">
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>

            <span>En casa</span>

        </label>


        <label class="location-option">

            <input type="radio" name="location" value="fuera">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24"
                 height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 class="lucide lucide-plane">
                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
            </svg>

            <span>Fuera</span>

        </label>

    </div>
</div>



            <div class="form-group">

                <label for="match-result">
                    Resultado
                </label>

                <select id="match-result">

                    <option value="pendiente">
                        Pendiente
                    </option>

                    <option value="ganado">
                        Ganado
                    </option>

                    <option value="perdido">
                        Perdido
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="primary-btn modal-save"
            >
                Guardar jornada
            </button>

        </form>

    </div>

</div>

    <script src="main.js"></script>

</body>
</html>
